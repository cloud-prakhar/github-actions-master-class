# =============================================================================
# Example 07 — Job Outputs
#
# WHAT YOU WILL LEARN:
#   - How to set a step output using $GITHUB_OUTPUT
#   - How to declare a job output that wraps a step output
#   - How a downstream job reads upstream job outputs via "needs"
#   - A realistic pattern: version detection → build → deploy
#
# THE DATA FLOW:
#
#   detect-version job
#     └─ step: detect version
#          └─ sets step output: app_version=1.4.2
#     └─ job output: version = steps.detect.outputs.app_version
#          │
#          ▼
#   build job (needs: detect-version)
#     └─ reads: needs.detect-version.outputs.version
#     └─ step: build artifact
#          └─ sets step output: artifact_path=dist/app-1.4.2.tar.gz
#     └─ job output: artifact = steps.build.outputs.artifact_path
#          │
#          ▼
#   deploy job (needs: [detect-version, build])
#     └─ reads: needs.detect-version.outputs.version
#     └─ reads: needs.build.outputs.artifact
#
# HOW TO USE:
#   1. Copy this file to .github/workflows/job-outputs.yml in your repo
#   2. Push to main and watch the three jobs chain together in the Actions tab
# =============================================================================

name: "07 - Job Outputs"

on:
  push:
    branches: [main]
  workflow_dispatch:

# ─── JOBS ─────────────────────────────────────────────────────────────────────
jobs:

  # ─── JOB 1: Detect version ──────────────────────────────────────────────────
  detect-version:
    name: Detect App Version
    runs-on: ubuntu-latest

    # ── STEP 1: Declare what this job exposes to downstream jobs ──────────────
    # "outputs:" maps a job-level output NAME to a step output expression.
    # Syntax: <output-name>: ${{ steps.<step-id>.outputs.<output-name> }}
    outputs:
      version: ${{ steps.detect.outputs.app_version }}
      branch: ${{ steps.detect.outputs.branch_name }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # This step uses "id:" so we can reference its outputs later.
      - name: Detect version
        id: detect                              # ← id is REQUIRED to read outputs
        run: |
          # In a real project you'd read from version.txt, setup.cfg, etc.
          # Here we simulate that by hardcoding a version.
          APP_VERSION="1.4.2"
          BRANCH="${{ github.ref_name }}"

          echo "Detected version: $APP_VERSION"
          echo "Current branch:   $BRANCH"

          # Write outputs using the $GITHUB_OUTPUT file.
          # Format: echo "<key>=<value>" >> $GITHUB_OUTPUT
          echo "app_version=$APP_VERSION" >> $GITHUB_OUTPUT
          echo "branch_name=$BRANCH" >> $GITHUB_OUTPUT

      - name: Confirm outputs were set
        run: |
          echo "Step outputs set:"
          echo "  app_version = ${{ steps.detect.outputs.app_version }}"
          echo "  branch_name = ${{ steps.detect.outputs.branch_name }}"

  # ─── JOB 2: Build ───────────────────────────────────────────────────────────
  build:
    name: Build v${{ needs.detect-version.outputs.version }}
    runs-on: ubuntu-latest

    # "needs:" makes this job wait for detect-version to complete successfully.
    # It also grants access to detect-version's outputs via "needs.<job>.outputs.*"
    needs: detect-version

    outputs:
      artifact: ${{ steps.build-step.outputs.artifact_path }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Read the version from the upstream job
      - name: Show version from upstream job
        run: |
          echo "========================================"
          echo "  UPSTREAM JOB OUTPUTS"
          echo "========================================"
          echo "  version: ${{ needs.detect-version.outputs.version }}"
          echo "  branch:  ${{ needs.detect-version.outputs.branch }}"
          echo "========================================"

      - name: Build application
        id: build-step
        run: |
          VERSION="${{ needs.detect-version.outputs.version }}"
          ARTIFACT="dist/app-${VERSION}.tar.gz"

          echo "Building version $VERSION..."
          echo "Creating artifact: $ARTIFACT"

          # Simulate build (create the dist directory)
          mkdir -p dist
          echo "App version $VERSION built at $(date -u)" > "dist/app-${VERSION}.tar.gz"

          echo "Build complete!"

          # Pass the artifact path to downstream jobs
          echo "artifact_path=$ARTIFACT" >> $GITHUB_OUTPUT

      - name: Show artifact path
        run: |
          echo "Artifact created at: ${{ steps.build-step.outputs.artifact_path }}"

  # ─── JOB 3: Deploy ──────────────────────────────────────────────────────────
  deploy:
    name: Deploy v${{ needs.detect-version.outputs.version }}
    runs-on: ubuntu-latest

    # This job needs BOTH upstream jobs to complete.
    # It can read outputs from both.
    needs: [detect-version, build]

    steps:
      - name: Show all upstream outputs
        run: |
          echo "========================================"
          echo "  ALL UPSTREAM OUTPUTS"
          echo "========================================"
          echo "  Version:  ${{ needs.detect-version.outputs.version }}"
          echo "  Branch:   ${{ needs.detect-version.outputs.branch }}"
          echo "  Artifact: ${{ needs.build.outputs.artifact }}"
          echo "========================================"

      - name: Deploy
        run: |
          echo "Deploying ${{ needs.build.outputs.artifact }}"
          echo "  Version:     ${{ needs.detect-version.outputs.version }}"
          echo "  Environment: production"
          echo ""
          echo "Deploy complete!"

      # You can also read the upstream job result (success/failure)
      - name: Check upstream job results
        run: |
          echo "detect-version result: ${{ needs.detect-version.result }}"
          echo "build result:          ${{ needs.build.result }}"
