# =============================================================================
# Full CI/CD Pipeline — Module 12, Project 10
# Production-Grade Pipeline for a Python 3.14 Flask Application
#
# Pipeline stages:
#   code-quality    ─┐
#   security-scan   ─┼─→ test ─→ build ─→ deploy-staging ─→ deploy-production
#   (parallel)       ┘                                    ↘
#                                                          pipeline-summary (always)
#
# Features:
#   - Concurrent, cancel-in-progress for PRs
#   - Parallel quality + security gates
#   - Dependency caching for speed
#   - Coverage reporting
#   - Multi-environment deployment with GitHub Environments
#   - Comprehensive job summary written to GITHUB_STEP_SUMMARY
#   - Always-runs pipeline summary job
# =============================================================================

name: Full CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      skip_deploy:
        description: 'Skip deployment (CI only)'
        type: boolean
        default: false

concurrency:
  group: full-cicd-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.14"
  APP_NAME: github-actions-demo
  REGISTRY: ghcr.io

defaults:
  run:
    shell: bash
    working-directory: module-12-real-world-cicd/project

# ─────────────────────────────────────────────────────────────────────────────
# JOB 1: CODE QUALITY
# Fast checks first — fail before spending time on tests.
# ─────────────────────────────────────────────────────────────────────────────
jobs:
  code-quality:
    name: Code Quality (flake8)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: module-12-real-world-cicd/project/requirements*.txt

      - name: Install linting tools
        run: pip install flake8

      - name: Run flake8
        run: |
          echo "Running code quality checks..."
          # flake8 src/ tests/ --max-line-length=120
          echo "[SIMULATED] flake8 → 0 violations"

      - name: Write quality summary
        if: always()
        run: |
          echo "## Code Quality Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Result |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| flake8 style | ✅ Passed |" >> $GITHUB_STEP_SUMMARY
          echo "| Line length | ✅ ≤120 chars |" >> $GITHUB_STEP_SUMMARY

  # ─────────────────────────────────────────────────────────────────────────
  # JOB 2: SECURITY SCAN (runs in parallel with code-quality)
  # ─────────────────────────────────────────────────────────────────────────
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: module-12-real-world-cicd/project/requirements*.txt

      - name: Install security tools
        run: pip install pip-audit safety

      - name: Run dependency audit
        run: |
          echo "Scanning dependencies for known vulnerabilities..."
          # In a real project: pip-audit -r requirements.txt
          echo "[SIMULATED] pip-audit → 0 vulnerabilities in 8 packages"

      - name: Run safety check
        run: |
          echo "Running safety check..."
          # safety check -r requirements.txt
          echo "[SIMULATED] safety → All good! 0 vulnerabilities found."

      - name: Write security summary
        if: always()
        run: |
          echo "## Security Scan Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Scanner | Vulnerabilities | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|---------|----------------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| pip-audit | 0 | ✅ Clean |" >> $GITHUB_STEP_SUMMARY
          echo "| safety | 0 | ✅ Clean |" >> $GITHUB_STEP_SUMMARY

  # ─────────────────────────────────────────────────────────────────────────
  # JOB 3: TEST (waits for both quality gates)
  # ─────────────────────────────────────────────────────────────────────────
  test:
    name: Test Suite (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [code-quality, security-scan]
    permissions:
      contents: read

    outputs:
      coverage-pct: ${{ steps.coverage.outputs.pct }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: module-12-real-world-cicd/project/requirements*.txt

      - name: Install dependencies
        run: |
          pip install flask pytest pytest-flask pytest-cov

      - name: Run tests
        run: |
          pytest tests/ \
            --cov=src \
            --cov-report=term-missing \
            --cov-report=html:htmlcov \
            -v --tb=short
        env:
          PYTHONPATH: src

      - name: Extract coverage percentage
        id: coverage
        run: |
          # In a real project, parse coverage.xml or coverage output
          PCT=89
          echo "pct=$PCT" >> $GITHUB_OUTPUT
          echo "Coverage: ${PCT}%"

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: module-12-real-world-cicd/project/htmlcov/
          retention-days: 14
          if-no-files-found: warn

      - name: Write test summary
        if: always()
        run: |
          echo "## Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Metric | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Total tests | 18 |" >> $GITHUB_STEP_SUMMARY
          echo "| Passed | 18 |" >> $GITHUB_STEP_SUMMARY
          echo "| Failed | 0 |" >> $GITHUB_STEP_SUMMARY
          echo "| Coverage | 89% |" >> $GITHUB_STEP_SUMMARY

  # ─────────────────────────────────────────────────────────────────────────
  # JOB 4: BUILD (after tests pass)
  # ─────────────────────────────────────────────────────────────────────────
  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: test
    permissions:
      contents: read
      packages: write

    outputs:
      image-tag: ${{ steps.tag.outputs.tag }}
      short-sha: ${{ steps.tag.outputs.short_sha }}

    steps:
      - uses: actions/checkout@v4

      - name: Set image tag
        id: tag
        run: |
          SHORT_SHA="${GITHUB_SHA:0:7}"
          IMAGE_TAG="${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.APP_NAME }}:${SHORT_SHA}"
          echo "short_sha=$SHORT_SHA" >> $GITHUB_OUTPUT
          echo "tag=$IMAGE_TAG" >> $GITHUB_OUTPUT
          echo "Image tag: $IMAGE_TAG"

      - name: Build Docker image (simulated)
        run: |
          echo "Building Docker image..."
          echo "  Dockerfile: module-12-real-world-cicd/project/Dockerfile"
          echo "  Tag: ${{ steps.tag.outputs.tag }}"
          echo "  Python: ${{ env.PYTHON_VERSION }}"
          echo ""
          echo "[SIMULATED] docker build -t ${{ steps.tag.outputs.tag }} ."
          echo "[SIMULATED] Build successful"
          echo ""
          echo "In a real workflow with a container registry:"
          echo "  docker login ghcr.io -u \${{ github.actor }} -p \${{ secrets.GITHUB_TOKEN }}"
          echo "  docker push ${{ steps.tag.outputs.tag }}"

      - name: Write build summary
        run: |
          echo "## Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Image Tag | \`${{ steps.tag.outputs.tag }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Commit SHA | \`${{ steps.tag.outputs.short_sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Python | ${{ env.PYTHON_VERSION }} |" >> $GITHUB_STEP_SUMMARY

  # ─────────────────────────────────────────────────────────────────────────
  # JOB 5: DEPLOY TO STAGING
  # Only on main/develop branches, not PRs.
  # ─────────────────────────────────────────────────────────────────────────
  deploy-staging:
    name: Deploy → Staging
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: build
    # Don't deploy PRs or skip_deploy==true runs
    if: |
      github.event_name != 'pull_request' &&
      inputs.skip_deploy != true
    environment: staging

    steps:
      - name: Deploy to staging
        run: |
          echo "Deploying ${{ needs.build.outputs.image-tag }} to staging..."
          echo "[SIMULATED] kubectl set image deployment/${{ env.APP_NAME }}-staging app=${{ needs.build.outputs.image-tag }}"
          echo "[SIMULATED] kubectl rollout status deployment/${{ env.APP_NAME }}-staging"

      - name: Staging health check
        run: |
          echo "Running post-deployment health check on staging..."
          echo "[SIMULATED] GET https://staging.example.com/health → 200 OK"
          echo "Staging deployment verified!"

      - name: Write deployment summary
        run: |
          echo "## Staging Deployment" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ Deployed \`${{ needs.build.outputs.short-sha }}\` to **staging**" >> $GITHUB_STEP_SUMMARY

  # ─────────────────────────────────────────────────────────────────────────
  # JOB 6: DEPLOY TO PRODUCTION
  # Only on main branch, after staging passes.
  # Requires manual approval via GitHub Environment protection rules.
  # ─────────────────────────────────────────────────────────────────────────
  deploy-production:
    name: Deploy → Production
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [build, deploy-staging]
    if: |
      github.ref == 'refs/heads/main' &&
      github.event_name != 'pull_request' &&
      inputs.skip_deploy != true
    # The "production" environment has required reviewers configured in GitHub.
    # GitHub will PAUSE this job and wait for an approval before continuing.
    environment: production

    steps:
      - name: Deploy to production
        run: |
          echo "Deploying ${{ needs.build.outputs.image-tag }} to production..."
          echo "[SIMULATED] kubectl set image deployment/${{ env.APP_NAME }}-production app=${{ needs.build.outputs.image-tag }}"
          echo "[SIMULATED] kubectl rollout status deployment/${{ env.APP_NAME }}-production"

      - name: Production health check
        run: |
          echo "Running post-deployment health check on production..."
          echo "[SIMULATED] GET https://app.example.com/health → 200 OK"
          echo "Production deployment verified!"

      - name: Write deployment summary
        run: |
          echo "## Production Deployment" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "🚀 Deployed \`${{ needs.build.outputs.short-sha }}\` to **production**" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Deployed by: @${{ github.actor }}" >> $GITHUB_STEP_SUMMARY

  # ─────────────────────────────────────────────────────────────────────────
  # JOB 7: PIPELINE SUMMARY (always runs)
  # ─────────────────────────────────────────────────────────────────────────
  pipeline-summary:
    name: Pipeline Summary
    runs-on: ubuntu-latest
    needs: [code-quality, security-scan, test, build, deploy-staging, deploy-production]
    if: always()

    steps:
      - name: Print full pipeline summary
        run: |
          echo "══════════════════════════════════════════════════════"
          echo "  FULL CI/CD PIPELINE SUMMARY"
          echo "══════════════════════════════════════════════════════"
          echo ""
          echo "  Repo:      ${{ github.repository }}"
          echo "  Branch:    ${{ github.ref_name }}"
          echo "  Commit:    ${{ github.sha }}"
          echo "  Actor:     ${{ github.actor }}"
          echo "  Trigger:   ${{ github.event_name }}"
          echo "  Python:    ${{ env.PYTHON_VERSION }}"
          echo ""
          echo "  ┌──────────────────────┬─────────────┐"
          echo "  │ Stage                │ Result      │"
          echo "  ├──────────────────────┼─────────────┤"
          echo "  │ code-quality         │ ${{ needs.code-quality.result }}     │"
          echo "  │ security-scan        │ ${{ needs.security-scan.result }}     │"
          echo "  │ test                 │ ${{ needs.test.result }}     │"
          echo "  │ build                │ ${{ needs.build.result }}     │"
          echo "  │ deploy-staging       │ ${{ needs.deploy-staging.result }}     │"
          echo "  │ deploy-production    │ ${{ needs.deploy-production.result }}     │"
          echo "  └──────────────────────┴─────────────┘"
          echo ""

          # Count failures
          FAILED=0
          for RESULT in \
            "${{ needs.code-quality.result }}" \
            "${{ needs.security-scan.result }}" \
            "${{ needs.test.result }}" \
            "${{ needs.build.result }}"; do
            [ "$RESULT" == "failure" ] && FAILED=$((FAILED+1))
          done

          if [ $FAILED -eq 0 ]; then
            echo "  OVERALL: ✅ PIPELINE PASSED"
          else
            echo "  OVERALL: ❌ $FAILED STAGE(S) FAILED"
            exit 1
          fi

      - name: Write final pipeline summary
        if: always()
        run: |
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "---" >> $GITHUB_STEP_SUMMARY
          echo "## Pipeline Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Stage | Result |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Code Quality | ${{ needs.code-quality.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Security Scan | ${{ needs.security-scan.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Tests | ${{ needs.test.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Build | ${{ needs.build.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Deploy Staging | ${{ needs.deploy-staging.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Deploy Production | ${{ needs.deploy-production.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "_Powered by GitHub Actions Master Class — Module 12_" >> $GITHUB_STEP_SUMMARY
