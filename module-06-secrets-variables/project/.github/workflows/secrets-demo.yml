# =============================================================================
# Module 06 — Secrets Demo
# =============================================================================
#
# PURPOSE:
#   This workflow demonstrates safe and correct usage of GitHub Actions secrets,
#   including:
#     • Referencing repository secrets in env: and with:
#     • How GitHub masks secret values in log output
#     • Conditional execution based on whether a secret is configured
#     • Using GITHUB_TOKEN (the auto-generated secret)
#     • Security best practices to prevent accidental secret exposure
#
# SETUP REQUIRED:
#   Before this workflow will fully function, add the following secrets to your
#   repository (Settings > Secrets and variables > Actions > New repository secret):
#
#     API_KEY       — Any placeholder value (e.g., "sk-demo-1234567890abcdef")
#     DATABASE_URL  — Any placeholder value (e.g., "postgres://user:pass@host/db")
#     SLACK_WEBHOOK — Optional, any value (used to show conditional steps)
#
#   Without these secrets, steps that reference them will receive empty strings.
#   The workflow will still run and demonstrate the patterns.
#
# KEY LEARNING POINTS:
#   1. Always pass secrets via env: (to scripts) or with: (to actions).
#   2. GitHub automatically masks secret values in logs with ***.
#   3. Never print a secret directly — even masked values can be reconstructed
#      if you print them character by character or encode them.
#   4. Secrets from forks are empty — this protects against exfiltration.
#   5. GITHUB_TOKEN is a special secret created automatically for each run.
# =============================================================================

name: "Module 06 — Secrets Demo"

# ── Trigger ──────────────────────────────────────────────────────────────────
on:
  push:
  workflow_dispatch:

# ── Permissions ──────────────────────────────────────────────────────────────
# SECURITY BEST PRACTICE: Always declare the minimum permissions your workflow
# needs. Here we only need to read repository contents.
permissions:
  contents: read

# ── Jobs ─────────────────────────────────────────────────────────────────────
jobs:

  # ============================================================================
  # JOB 1: Basic Secret Usage
  # ============================================================================
  # Shows how to reference secrets correctly and how masking works in logs.
  basic-secret-usage:
    name: "1 · Basic Secret Usage"
    runs-on: ubuntu-latest

    steps:
      # ── Step 1.1: Pass a secret via env: to a shell script ──────────────────
      # CORRECT PATTERN: Pass the secret as an environment variable, then
      # reference the env var ($API_KEY) inside the script.
      #
      # WHY env:? Because env: is the standard, well-supported way to pass a
      # secret value into a subprocess (the shell). Inline ${{ secrets.API_KEY }}
      # would also work, but it inserts the value directly into the YAML, which
      # some linters warn about and which can expose secrets in certain debug
      # scenarios.
      - name: "1.1 — Use API_KEY secret in a script (via env:)"
        env:
          # The secret is assigned to an environment variable named API_KEY.
          # The script below reads $API_KEY, never touching ${{ secrets.API_KEY }}
          # directly.
          API_KEY: ${{ secrets.API_KEY }}
        run: |
          echo "Calling an API using the API_KEY secret..."
          echo ""
          # In a real workflow you would do something like:
          #   curl -H "Authorization: Bearer $API_KEY" https://api.example.com/data
          #
          # For demo purposes we just show that the variable is set:
          if [ -n "$API_KEY" ]; then
            echo "API_KEY is SET (value is masked in logs)."
          else
            echo "API_KEY is EMPTY — did you add the secret to the repository?"
          fi
          echo ""
          # MASKING DEMO: if the secret is set, attempting to print it will show ***
          echo "Attempting to print API_KEY value (will be masked if set):"
          echo "API_KEY = $API_KEY"
          # Expected log output: API_KEY = ***
          # GitHub replaces the actual value with *** automatically.

      # ── Step 1.2: Pass a secret via env: (DATABASE_URL) ─────────────────────
      - name: "1.2 — Use DATABASE_URL secret"
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          echo "Connecting to database..."
          echo ""
          if [ -n "$DATABASE_URL" ]; then
            echo "DATABASE_URL is SET."
            echo "A real migration step would run: ./migrate.sh --url \"\$DATABASE_URL\""
          else
            echo "DATABASE_URL is EMPTY — add the secret to see the masking demo."
          fi
          echo ""
          echo "Attempting to print DATABASE_URL (will show *** if set):"
          echo "DATABASE_URL = $DATABASE_URL"

      # ── Step 1.3: Demonstrate what masking looks like ───────────────────────
      # This step is purely educational. It creates a LOCAL variable (not from
      # secrets) to simulate a known value, shows it unmasked, then wraps it to
      # illustrate why you should never log secret values even if you think they
      # are masked.
      - name: "1.3 — Masking demonstration with a fake secret"
        run: |
          echo "===== Why Masking Is Not a Complete Security Solution ====="
          echo ""
          echo "GitHub masks exact secret values. But obfuscated versions are NOT masked."
          echo ""
          FAKE_SECRET="MySuperSecretValue"
          echo "Original value (unmasked because it's a local var, not a secret):"
          echo "  $FAKE_SECRET"
          echo ""
          echo "Base64-encoded version (NOT masked even if original were a secret):"
          echo "  $(echo -n "$FAKE_SECRET" | base64)"
          echo ""
          echo "URL-encoded version (NOT masked):"
          printf '%s' "$FAKE_SECRET" | python3 -c "import urllib.parse,sys; print(urllib.parse.quote(sys.stdin.read()))" || echo "  (python3 not available for this demo)"
          echo ""
          echo "LESSON: Never log secrets in ANY form. The masking is a safety net,"
          echo "not an excuse to print them."


  # ============================================================================
  # JOB 2: Secrets in Actions (with: inputs)
  # ============================================================================
  # Many third-party actions accept secrets as `with:` inputs.
  # This job shows the pattern.
  secrets-in-actions:
    name: "2 · Secrets as Action Inputs (with:)"
    runs-on: ubuntu-latest

    steps:
      # ── Step 2.1: Pass secret as action input ───────────────────────────────
      # The `with:` block passes named inputs to an action.
      # Secrets referenced here are handled securely by the action.
      #
      # Pattern (using a hypothetical notification action):
      #
      #   - uses: some-org/notify-action@v1
      #     with:
      #       webhook-url: ${{ secrets.SLACK_WEBHOOK }}
      #       message: "Build succeeded"
      #
      # We use `actions/github-script` here as a real example that accepts
      # a token via with:.
      - name: "2.1 — Pass GITHUB_TOKEN as with: input to an action"
        uses: actions/github-script@v7
        with:
          # github-script requires a GitHub token.
          # Passing it via `with: github-token:` is the action's documented way.
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            // This script runs inside the action with access to the token.
            // We list this workflow's runs as a demonstration.
            const runs = await github.rest.actions.listWorkflowRunsForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 3,
            });
            console.log('Recent workflow runs:');
            for (const run of runs.data.workflow_runs) {
              console.log(`  [${run.status}] ${run.name} — ${run.head_sha.slice(0, 7)}`);
            }
            console.log('');
            console.log('Notice: the token value never appeared in the logs above.');

      # ── Step 2.2: Two-step pattern: secret → env → command ──────────────────
      # For CLI tools that read from env (gh, aws, azure), use env: on the step.
      # This is cleaner than passing --token flags on every command.
      - name: "2.2 — Pass secret to CLI tool via env:"
        env:
          # gh CLI reads GH_TOKEN automatically for authentication
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Using gh CLI with GITHUB_TOKEN for authentication..."
          echo ""
          echo "Repository information (using gh CLI):"
          gh repo view "$GITHUB_REPOSITORY" --json name,description,isPrivate \
            --template '  Name:        {{.name}}{{"\n"}}  Description: {{.description}}{{"\n"}}  Private:     {{.isPrivate}}{{"\n"}}' \
            || echo "  (gh repo view failed — ensure GITHUB_TOKEN has contents:read permission)"


  # ============================================================================
  # JOB 3: Conditional Execution Based on Secret Availability
  # ============================================================================
  # Use case: optional integrations (Slack, PagerDuty, etc.) that you only want
  # to trigger if the secret is actually configured in the repository.
  conditional-on-secret:
    name: "3 · Conditional Steps Based on Secret Availability"
    runs-on: ubuntu-latest

    steps:
      # ── Step 3.1: Check if optional secret is set ───────────────────────────
      # We cannot read the secret value to check if it's set (it would be masked).
      # Instead, we use the expression ${{ secrets.SECRET_NAME != '' }} which
      # evaluates to true if the secret has a non-empty value.
      - name: "3.1 — Check if SLACK_WEBHOOK is configured"
        id: check-slack
        run: |
          # We expose a boolean flag as a step output so later steps can use it.
          # We cannot use secrets in run: directly for the comparison, so we
          # rely on the YAML expression evaluation (done in if: conditions).
          echo "Checking whether optional secrets are configured..."
          echo "This check is done in the if: conditions of subsequent steps."

      # ── Step 3.2: Step that only runs if secret is set ──────────────────────
      # The `if:` expression checks whether the secret is non-empty.
      # If SLACK_WEBHOOK is not set, this step is skipped with "(skipped)" in the UI.
      - name: "3.2 — Send Slack notification (only if SLACK_WEBHOOK is set)"
        if: ${{ secrets.SLACK_WEBHOOK != '' }}
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
        run: |
          echo "SLACK_WEBHOOK is configured — sending notification..."
          # Real implementation:
          # curl -X POST "$SLACK_WEBHOOK" \
          #   -H "Content-Type: application/json" \
          #   -d '{"text": "Build succeeded in ${{ github.repository }}"}'
          echo "Notification sent (simulated — add real curl in production)."

      # ── Step 3.3: Fallback when secret is missing ───────────────────────────
      - name: "3.3 — Skip notification (SLACK_WEBHOOK not configured)"
        if: ${{ secrets.SLACK_WEBHOOK == '' }}
        run: |
          echo "SLACK_WEBHOOK is not configured — skipping Slack notification."
          echo ""
          echo "To enable Slack notifications:"
          echo "  1. Go to Settings > Secrets and variables > Actions"
          echo "  2. Add a secret named SLACK_WEBHOOK with your webhook URL"
          echo "  3. Re-run this workflow"

      # ── Step 3.4: Always-run summary ────────────────────────────────────────
      - name: "3.4 — Summary"
        run: |
          echo "===== Conditional Secret Usage Pattern ====="
          echo ""
          echo "Pattern:"
          echo "  - name: Optional step"
          echo "    if: \${{ secrets.OPTIONAL_SECRET != '' }}"
          echo "    env:"
          echo "      MY_SECRET: \${{ secrets.OPTIONAL_SECRET }}"
          echo "    run: ./use-secret.sh"
          echo ""
          echo "This lets you make integrations optional without breaking the workflow"
          echo "when the secret is not configured."


  # ============================================================================
  # JOB 4: Security Anti-Patterns (what NOT to do)
  # ============================================================================
  # This job shows common mistakes — all commented out — with explanations.
  # Reading this output in the log teaches by example.
  security-antipatterns:
    name: "4 · Security Anti-Patterns (Educational)"
    runs-on: ubuntu-latest

    steps:
      - name: "4.1 — Common secret security mistakes (for education)"
        run: |
          echo "===== Security Anti-Patterns to Avoid ====="
          echo ""
          echo "─────────────────────────────────────────────────────────────────"
          echo "ANTI-PATTERN 1: Hardcoded secret in workflow YAML"
          echo "─────────────────────────────────────────────────────────────────"
          echo ""
          echo "  BAD:"
          echo "    env:"
          echo "      API_KEY: sk-live-abc123xyz  # HARDCODED — visible to anyone!"
          echo ""
          echo "  GOOD:"
          echo "    env:"
          echo "      API_KEY: \${{ secrets.API_KEY }}  # stored encrypted in GitHub"
          echo ""
          echo "─────────────────────────────────────────────────────────────────"
          echo "ANTI-PATTERN 2: Printing a secret to the log"
          echo "─────────────────────────────────────────────────────────────────"
          echo ""
          echo "  BAD:"
          echo "    - run: echo \"My API key is: \${{ secrets.API_KEY }}\""
          echo "      # Even if masked (***), someone could reconstruct it"
          echo "      # by printing one character at a time."
          echo ""
          echo "  GOOD:"
          echo "    - run: |"
          echo "        if [ -n \"\$API_KEY\" ]; then echo 'API_KEY is set'; fi"
          echo ""
          echo "─────────────────────────────────────────────────────────────────"
          echo "ANTI-PATTERN 3: Passing a secret as a command-line argument"
          echo "─────────────────────────────────────────────────────────────────"
          echo ""
          echo "  BAD:"
          echo "    - run: ./deploy.sh --api-key \${{ secrets.API_KEY }}"
          echo "      # Command-line arguments appear in process listings (ps aux)"
          echo ""
          echo "  GOOD:"
          echo "    - env:"
          echo "        API_KEY: \${{ secrets.API_KEY }}"
          echo "      run: ./deploy.sh  # script reads \$API_KEY from environment"
          echo ""
          echo "─────────────────────────────────────────────────────────────────"
          echo "ANTI-PATTERN 4: Using a third-party action without pinning"
          echo "─────────────────────────────────────────────────────────────────"
          echo ""
          echo "  BAD:"
          echo "    - uses: unknown-org/action@main  # latest code, could change"
          echo "      with:"
          echo "        token: \${{ secrets.GITHUB_TOKEN }}"
          echo ""
          echo "  GOOD:"
          echo "    - uses: unknown-org/action@a1b2c3d4e5f6  # pinned to SHA"
          echo "      with:"
          echo "        token: \${{ secrets.GITHUB_TOKEN }}"
          echo ""
          echo "─────────────────────────────────────────────────────────────────"
          echo "ANTI-PATTERN 5: Checking out untrusted code and running it with secrets"
          echo "─────────────────────────────────────────────────────────────────"
          echo ""
          echo "  BAD:"
          echo "    on: pull_request_target"
          echo "    jobs:"
          echo "      build:"
          echo "        steps:"
          echo "          - uses: actions/checkout@v4"
          echo "            with:"
          echo "              ref: \${{ github.event.pull_request.head.sha }}  # DANGER"
          echo "          - run: npm install && npm build  # runs attacker's code with secrets"
          echo ""
          echo "  GOOD:"
          echo "    Use 'pull_request' (not 'pull_request_target') for untrusted code."
          echo "    Never check out the PR's code in pull_request_target workflows."


  # ============================================================================
  # JOB 5: GITHUB_TOKEN Quick Reference
  # ============================================================================
  github-token-quick-reference:
    name: "5 · GITHUB_TOKEN Quick Reference"
    runs-on: ubuntu-latest
    # Give only the permissions this job actually needs
    permissions:
      contents: read

    steps:
      - name: "5.1 — GITHUB_TOKEN overview"
        run: |
          echo "===== GITHUB_TOKEN Quick Reference ====="
          echo ""
          echo "GITHUB_TOKEN is an automatic secret created by GitHub for each run."
          echo "It is available as:"
          echo "  \${{ secrets.GITHUB_TOKEN }}  — in YAML expressions"
          echo "  \$GITHUB_TOKEN               — in shell scripts"
          echo ""
          echo "Use it for:"
          echo "  1. GitHub REST/GraphQL API calls"
          echo "  2. gh CLI authentication (set GH_TOKEN=\${{ secrets.GITHUB_TOKEN }})"
          echo "  3. git push over HTTPS to the current repository"
          echo "  4. Creating releases, comments, labels, statuses"
          echo ""
          echo "Limitations:"
          echo "  1. Scoped to the current repository ONLY"
          echo "  2. Expires when the workflow run ends"
          echo "  3. Cannot trigger other workflows (prevents infinite loops)"
          echo "  4. Cannot approve its own pull requests"
          echo ""
          echo "For cross-repository or cross-organization tasks, use a PAT stored"
          echo "as a secret (e.g., secrets.PERSONAL_ACCESS_TOKEN)."

      - name: "5.2 — Show GITHUB_TOKEN is available as env var"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Using GITHUB_TOKEN via GH_TOKEN env var for gh CLI..."
          echo ""
          echo "Current repository:"
          gh repo view --json name,url --template '  {{.name}}: {{.url}}{{"\n"}}' \
            || echo "  (gh CLI not available or token insufficient)"
